<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF8EE">
<title>まいにちウォーキング</title>
<style>
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#26241F; --sub:#5F5A50; --line:#E6DCCB;
  --ok:#1C8A57; --ok-soft:#DDF3E6; --miss:#A9B4BF; --rest:#D9912B; --rest-soft:#FCEBCF;
  --fire:#E2571C; --accent:#1F6FB5;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.6;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 12px}
h2{font-size:22px;margin:0 0 8px}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.center{text-align:center}
.sub{color:var(--sub);font-size:17px}
.big{font-size:30px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:60px;border-radius:14px;border:2px solid var(--ok);background:var(--ok);
  color:#fff;font-size:21px;font-weight:700;padding:10px 14px;margin-top:10px}
.btn.ghost{background:#fff;color:var(--ok)}
.btn.warn{background:#fff;color:#A33A12;border-color:#A33A12}
.tab{display:none}
.tab.on{display:block}

/* 下のタブ */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;min-height:76px;font-size:15px;font-weight:700;color:var(--sub)}
nav button span{display:block;font-size:28px;line-height:1.2}
nav button.on{color:var(--ok);box-shadow:inset 0 4px 0 var(--ok)}

/* きょう */
.ring{position:relative;width:min(78vw,300px);margin:6px auto 4px}
.ring svg{display:block;width:100%}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.steps{font-size:60px;font-weight:800;line-height:1.1}
.badge{display:inline-block;background:var(--ok);color:#fff;border-radius:999px;padding:4px 18px;font-weight:700;font-size:20px;margin-top:6px}
.streak{font-size:26px;font-weight:800;color:var(--fire)}
.streak b{font-size:52px}
.week{display:flex;justify-content:space-between;gap:4px;margin-top:10px}
.week div{flex:1;text-align:center;font-size:16px;color:var(--sub)}
.dot{width:40px;height:40px;border-radius:50%;margin:4px auto 0;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--sub)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.rest{background:var(--rest-soft);border-color:var(--rest);color:#7A4A06}
.dot.today{border-color:var(--ok);border-style:dashed}
.bar{height:16px;background:#EFE7D8;border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}

/* グラフ */
.seg{display:flex;gap:8px;margin-bottom:8px}
.seg button{flex:1;min-height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700}
.seg button.on{border-color:var(--ok);background:var(--ok-soft);color:#0F5B38}
.chart svg{width:100%;display:block;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px;color:var(--sub);margin-top:4px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.pick{min-height:34px;font-weight:700;margin-top:6px}
table{width:100%;border-collapse:collapse}
td{padding:9px 4px;border-bottom:1px solid var(--line)}
td.r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mk{display:inline-block;min-width:54px;text-align:center;border-radius:8px;padding:1px 6px;font-size:16px;font-weight:700}
.mk.ok{background:var(--ok-soft);color:#0F5B38}
.mk.rest{background:var(--rest-soft);color:#7A4A06}

/* 旅 */
.road{list-style:none;margin:0;padding:0}
.road li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.road .no{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;flex:none;background:#fff;color:var(--sub)}
.road li.done .no{background:var(--ok);border-color:var(--ok);color:#fff}
.road li.here{background:#FFF1D6;border-radius:12px;padding-left:8px;padding-right:8px}
.road li.here .no{background:var(--fire);border-color:var(--fire);color:#fff}
.road .nm{flex:1;font-weight:700}
.road .km{color:var(--sub);font-size:16px;font-variant-numeric:tabular-nums}

/* 先生へ */
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.monthnav button{width:64px;min-height:56px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:800}
.monthnav div{flex:1;text-align:center;font-size:24px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#FBF5EA;border-radius:14px;padding:10px 12px}
.stat span{display:block;font-size:16px;color:var(--sub)}
.stat b{font-size:28px;font-variant-numeric:tabular-nums}
.stat small{font-size:16px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .h{text-align:center;font-size:15px;color:var(--sub);font-weight:700}
.cal .c{border:1px solid var(--line);border-radius:8px;min-height:62px;padding:2px;text-align:center;font-size:14px;background:#fff}
.cal .c b{display:block;font-size:15px}
.cal .c em{display:block;font-style:normal;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.cal .c.ok{background:var(--ok-soft);border-color:var(--ok)}
.cal .c.rest{background:var(--rest-soft);border-color:var(--rest)}
.cal .c .m{font-size:17px;font-weight:800;line-height:1.1;min-height:19px}
.cal .c.ok .m{color:#0F5B38}

/* 設定 */
.setrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.setrow button{width:72px;height:64px;border-radius:14px;border:2px solid var(--ok);background:#fff;color:var(--ok);font-size:34px;font-weight:800;flex:none}
.setrow div{flex:1;text-align:center;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.setrow div small{font-size:18px}

/* お祝い */
#cele{position:fixed;inset:0;background:rgba(38,36,31,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#cele.on{display:flex}
#cele canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cele .box{position:relative;background:#fff;border-radius:24px;padding:22px 18px;max-width:440px;width:100%;text-align:center}
#cele .emo{font-size:84px;line-height:1.1;animation:pop .7s ease-out}
#cele h2{font-size:36px;color:var(--ok);margin:4px 0}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#demobar{display:none;background:#FFE9A8;text-align:center;padding:8px;font-weight:700}
#demobar.on{display:block}
#demobar button{margin-left:8px;border:2px solid var(--ink);background:#fff;border-radius:10px;padding:4px 12px;font-weight:700}

@media print{
  body{background:#fff;padding:0;font-size:14px}
  nav,#demobar,#cele,.noprint{display:none!important}
  .tab{display:none!important}
  #t-report{display:block!important}
  .card{border:0;padding:0;margin-bottom:10px}
  .ok,.rest,.stat{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="demobar">見本のデータを表示中<button onclick="endDemo()">見本を終わる</button></div>
<main>
  <section class="tab on" id="t-home"></section>
  <section class="tab" id="t-log"></section>
  <section class="tab" id="t-trip"></section>
  <section class="tab" id="t-report"></section>
  <section class="tab" id="t-set"></section>
</main>

<nav>
  <button data-t="home" class="on"><span>🏠</span>きょう</button>
  <button data-t="log"><span>📊</span>きろく</button>
  <button data-t="trip"><span>🗾</span>歩き旅</button>
  <button data-t="report"><span>📋</span>先生へ</button>
  <button data-t="set"><span>⚙️</span>設定</button>
</nav>

<div id="cele"><canvas></canvas><div class="box" id="celebox"></div></div>

<script>
// ---------- 東海道五十三次（宿場名, 前の宿場からのおおよその距離km） ----------
const ROAD=[["日本橋",0],["品川",7.8],["川崎",9.8],["神奈川",9.8],["保土ヶ谷",4.9],["戸塚",8.8],["藤沢",7.8],["平塚",13.7],
["大磯",2.9],["小田原",15.7],["箱根",16.6],["三島",14.7],["沼津",5.9],["原",5.9],["吉原",11.8],["蒲原",11.1],["由比",3.9],
["興津",9.1],["江尻",4.1],["府中",10.5],["丸子",5.6],["岡部",7.8],["藤枝",6.7],["島田",8.6],["金谷",3.9],["日坂",6.5],
["掛川",7.1],["袋井",9.5],["見付",5.9],["浜松",16.4],["舞坂",10.8],["新居",5.9],["白須賀",6.5],["二川",5.7],["吉田",6.1],
["御油",10.2],["赤坂",1.7],["藤川",8.8],["岡崎",6.6],["池鯉鮒",14.9],["鳴海",11.0],["宮",6.5],["桑名",27.5],["四日市",12.6],
["石薬師",10.7],["庄野",2.7],["亀山",7.8],["関",5.9],["坂下",6.5],["土山",9.7],["水口",10.5],["石部",13.7],["草津",11.7],
["大津",14.3],["京都 三条大橋",11.7]];
const CUM=[];ROAD.reduce((a,r,i)=>(CUM[i]=a+r[1]),0);
const TOTAL=CUM[CUM.length-1];

// ---------- 保存データ ----------
const KEY='walk-keizoku-v1';
const DEF={goals:[{from:'2000-01-01',goal:2000}],tickets:2,stride:65,start:null,days:{},celebrated:'',station:0};
const fresh=()=>JSON.parse(JSON.stringify(DEF));
let S=load(), demo=false, backup=null, range=14, picked=null, repMonth=null;
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}}
function save(){if(demo)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// ---------- 日付 ----------
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const parse=s=>{const a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])};
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const today=()=>ymd(new Date());
const WD='日月火水木金土';
const fmt=n=>Math.round(n).toLocaleString('ja-JP');
const jdate=k=>{const d=parse(k);return (d.getMonth()+1)+'月'+d.getDate()+'日('+WD[d.getDay()]+')'};

// ---------- 目標・連続日数・お休みチケット ----------
function goalOn(k){let g=2000;for(const e of S.goals)if(e.from<=k)g=e.goal;return g}
function setGoal(v){const t=today(),l=S.goals[S.goals.length-1];if(l.from===t)l.goal=v;else S.goals.push({from:t,goal:v})}
// 達成の丸・連続日数・お休みチケットは、アプリを始めた日(S.start)以降の日だけが対象。それより前は 'pre'（歩数の表示のみ）
function analyze(){
  const t=today(),keys=Object.keys(S.days).sort(),st={},used={};
  let run=0,best=0;
  if(keys.length)for(let d=parse(keys[0]);ymd(d)<=t;d=add(d,1)){
    const k=ymd(d),v=S.days[k]||0,m=k.slice(0,7);
    if(S.start&&k<S.start)st[k]='pre';
    else if(v>=goalOn(k)){st[k]='ok';run++}
    else if(k===t)st[k]='today';
    else if(run>0&&S.start&&k>=S.start&&(used[m]||0)<S.tickets){st[k]='rest';used[m]=(used[m]||0)+1}
    else{st[k]='miss';run=0}
    if(run>best)best=run;
  }
  return {st,streak:run,best,left:Math.max(0,S.tickets-(used[t.slice(0,7)]||0))};
}

// ---------- 歩き旅 ----------
function trip(){
  let steps=0;
  if(S.start)for(const k in S.days)if(k>=S.start)steps+=S.days[k];
  const dist=steps*S.stride/100000, lap=Math.floor(dist/TOTAL), pos=dist-lap*TOTAL;
  let i=0;while(i<ROAD.length-1&&CUM[i+1]<=pos)i++;
  return {steps,dist,lap,pos,i,g:lap*ROAD.length+i};
}

// ---------- ショートカットからの歩数の受け取り ----------
// 形式:  #2026-10-10=1234;2026-10-09=2500;...
function takeHash(){
  let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){h=location.hash.slice(1)}
  if(!h)return;
  if(h==='demo'){startDemo();return}
  const re=/(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})[^=;]*=\s*([\d,]+(?:\.\d+)?)/g,got={};let m;
  while((m=re.exec(h))){const k=m[1]+'-'+p2(m[2])+'-'+p2(m[3]);got[k]=(got[k]||0)+Math.round(parseFloat(m[4].replace(/,/g,'')))}
  if(Object.keys(got).length){
    if(demo)endDemo(true);
    S=load(); // 他のタブで保存された最新の記録を読み直してから足す
    Object.assign(S.days,got);
    if(!S.start)S.start=today();
    save();
  }
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
}

// ---------- 見本 ----------
function startDemo(){
  if(!demo)backup=S;
  demo=true;S=fresh();
  const t=new Date();
  const v=[2300,2650,1200,2100,2480,0,2050,2900,2210,2600,1800,2350,2120,2700,3100,2250,900,2400,2150,2800,2050,2300,2600,1500,
           2200,2450,2950,2100,2380,2520,1100,2240,2660,2300,2050,2480,2700,2150,2900,3200,2350,2600,2180,2440,2130];
  v.forEach((x,i)=>{S.days[ymd(add(t,i-v.length+1))]=x});
  S.start=ymd(add(t,-v.length+1));S.station=0;S.celebrated='';
  document.getElementById('demobar').classList.add('on');
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  render();checkCelebrate();
}
function endDemo(quiet){demo=false;S=backup||load();backup=null;document.getElementById('demobar').classList.remove('on');if(!quiet)render()}

// ---------- 画面：きょう ----------
function cheer(n,done){
  const ms=[3,7,14,21,30,50,75,100,150,200,300,365];
  const nx=ms.find(x=>x>n);
  if(!done){
    if(n>0)return '今日歩けば <b>'+(n+1)+'日連続</b> になります。';
    return '今日が新しい1日目。ゆっくり歩きましょう。';
  }
  let s='明日も歩けば <b>'+(n+1)+'日連続</b>！';
  if(nx)s+='<br>あと'+(nx-n)+'日で「'+nx+'日連続」の節目です。';
  return s;
}
function renderHome(){
  const el=document.getElementById('t-home'),t=today(),A=analyze(),T=trip();
  if(!Object.keys(S.days).length){
    el.innerHTML='<h1>まいにちウォーキング</h1><div class="card"><h2>はじめに</h2>'+
    '<p>iPhoneのホーム画面にある<b>「ウォーキング」ショートカット</b>を押すと、ヘルスケアの歩数が読み込まれてこの画面に表示されます。</p>'+
    '<p class="sub">まだ歩数が届いていません。まずは見本でどんな画面か見てみましょう。</p>'+
    '<button class="btn" onclick="startDemo()">見本を見る</button></div>';
    return;
  }
  const v=S.days[t]||0,g=goalOn(t),done=v>=g,r=Math.min(1,v/g),C=2*Math.PI*88;
  let wk='';
  for(let i=6;i>=0;i--){const d=add(new Date(),-i),k=ymd(d),s=A.st[k];
    wk+='<div>'+WD[d.getDay()]+'<div class="dot '+(s||'')+'">'+(s==='ok'?'◎':s==='rest'?'休':'')+'</div></div>'}
  const nx=T.i<ROAD.length-1?ROAD[T.i+1]:null, togo=nx?CUM[T.i+1]-T.pos:0, seg=nx?nx[1]:1;
  el.innerHTML='<h1>'+jdate(t)+'</h1>'+
  '<div class="card center"><div class="ring"><svg viewBox="0 0 200 200">'+
    '<circle cx="100" cy="100" r="88" fill="none" stroke="#EFE7D8" stroke-width="16"/>'+
    (r>0?'<circle cx="100" cy="100" r="88" fill="none" stroke="'+(done?'var(--ok)':'var(--accent)')+'" stroke-width="16" stroke-linecap="round" '+
    'stroke-dasharray="'+(C*r)+' '+C+'" transform="rotate(-90 100 100)"/>':'')+'</svg>'+
    '<div class="in"><div class="sub">きょうの歩数</div><div class="steps">'+fmt(v)+'</div><div class="sub">目標 '+fmt(g)+' 歩</div>'+
    (done?'<div class="badge">達成！</div>':'')+'</div></div>'+
    (done?'<button class="btn ghost" onclick="celebrate(true)">🎉 もう一度お祝いを見る</button>':'')+'</div>'+
  '<div class="card center"><div class="streak">🔥 連続 <b>'+A.streak+'</b> 日</div>'+
    '<p>'+cheer(A.streak,done)+'</p><div class="week">'+wk+'</div>'+
    '<p class="sub" style="margin-top:12px">これまでの最高 '+A.best+'日 ／ 今月のお休みチケット 残り '+A.left+'枚</p></div>'+
  '<div class="card"><h2>🗾 東海道五十三次の旅'+(T.lap?'（'+(T.lap+1)+'周目）':'')+'</h2>'+
    (nx?'<p>いま <b>'+ROAD[T.i][0]+'</b> を過ぎたところ。<br>次は <b>'+nx[0]+'</b>（あと '+togo.toFixed(1)+' km）</p>'+
      '<div class="bar"><i style="width:'+Math.max(3,100*(1-togo/seg))+'%"></i></div>'
      :'<p><b>京都 三条大橋</b> に到着しました！</p>')+
    '<p class="sub">日本橋から '+T.pos.toFixed(1)+' km ／ 全 '+TOTAL.toFixed(0)+' km</p>'+
    '<button class="btn ghost" onclick="go(\'trip\')">旅の地図を見る</button></div>';
}

// ---------- 画面：きろく ----------
function chartSVG(keys,A){
  const W=340,H=210,L=6,R=6,T=26,B=28,pw=W-L-R,ph=H-T-B,n=keys.length,g=goalOn(today());
  const max=Math.max(g*1.25,...keys.map(k=>S.days[k]||0))*1.05, y=v=>T+ph-ph*v/max, bw=pw/n, w=Math.max(4,bw-2);
  let s='<defs><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
    '<rect width="6" height="6" fill="#FCEBCF"/><rect width="3" height="6" fill="#D9912B"/></pattern></defs>';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="#CFC4B0"/>';
  keys.forEach((k,i)=>{
    const v=S.days[k]||0,st=A.st[k],x=L+i*bw+(bw-w)/2,d=parse(k),top=y(v),h=T+ph-top,rr=Math.min(4,w/2,h);
    const fill=st==='ok'?'#1C8A57':st==='rest'?'url(#hat)':st==='today'?'#1F6FB5':st==='pre'?'#D9D2C3':'#A9B4BF';
    if(h>0.5)s+='<path d="M'+x+' '+(T+ph)+'V'+(top+rr)+'q0 -'+rr+' '+rr+' -'+rr+'h'+(w-2*rr)+'q'+rr+' 0 '+rr+' '+rr+'V'+(T+ph)+'z" fill="'+fill+'"'+
      (picked===k?' stroke="#26241F" stroke-width="2"':'')+'/>';
    else if(st==='rest')s+='<rect x="'+x+'" y="'+(T+ph-6)+'" width="'+w+'" height="6" fill="url(#hat)"/>';
    const every=n>20?5:2;
    const near1=n>20&&(d.getDate()>=29||d.getDate()<=3);
    if(d.getDate()===1||((n-1-i)%every===0&&!near1))s+='<text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="#5F5A50">'+
      (d.getDate()===1||i===0?(d.getMonth()+1)+'/':'')+d.getDate()+'</text>';
    s+='<rect x="'+(L+i*bw)+'" y="'+T+'" width="'+bw+'" height="'+(ph+B)+'" fill="transparent" onclick="pick(\''+k+'\')"/>';
  });
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="#26241F" stroke-width="1.5" stroke-dasharray="5 4"/>'+
     '<text x="'+L+'" y="'+(y(g)-6)+'" font-size="13" font-weight="700" fill="#26241F" paint-order="stroke" stroke="#fff" stroke-width="4">目標 '+fmt(g)+'歩</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="毎日の歩数の棒グラフ">'+s+'</svg>';
}
function mark(st){return st==='ok'?'<span class="mk ok">◎ 達成</span>':st==='rest'?'<span class="mk rest">お休み</span>':''}
function pick(k){picked=k;renderLog()}
function renderLog(){
  const el=document.getElementById('t-log'),A=analyze(),keys=[];
  for(let i=range-1;i>=0;i--)keys.push(ymd(add(new Date(),-i)));
  const vals=keys.map(k=>S.days[k]||0),sum=vals.reduce((a,b)=>a+b,0);
  let rows='';
  for(let i=0;i<14;i++){const k=ymd(add(new Date(),-i));rows+='<tr><td>'+jdate(k)+'</td><td class="r">'+fmt(S.days[k]||0)+' 歩</td><td>'+mark(A.st[k])+'</td></tr>'}
  el.innerHTML='<h1>歩数のきろく</h1><div class="card">'+
    '<div class="seg"><button class="'+(range===14?'on':'')+'" onclick="range=14;renderLog()">2週間</button>'+
    '<button class="'+(range===30?'on':'')+'" onclick="range=30;renderLog()">30日間</button></div>'+
    '<div class="chart">'+chartSVG(keys,A)+'</div>'+
    '<div class="legend"><span><i style="background:#1C8A57"></i>達成</span><span><i style="background:#A9B4BF"></i>未達成</span>'+
    '<span><i style="background:repeating-linear-gradient(45deg,#D9912B 0 3px,#FCEBCF 3px 6px)"></i>お休み</span><span><i style="background:#1F6FB5"></i>きょう</span><span><i style="background:#D9D2C3"></i>始める前</span></div>'+
    '<div class="pick">'+(picked&&keys.includes(picked)?jdate(picked)+'：'+fmt(S.days[picked]||0)+' 歩 '+mark(A.st[picked]):'<span class="sub">棒を押すと、その日の歩数が出ます</span>')+'</div>'+
    '<p class="sub">この期間の平均 '+fmt(sum/range)+' 歩／日　達成 '+keys.filter(k=>A.st[k]==='ok').length+' 日</p></div>'+
    '<div class="card"><h2>この2週間</h2><table>'+rows+'</table></div>';
}

// ---------- 画面：歩き旅 ----------
function renderTrip(){
  const el=document.getElementById('t-trip'),T=trip();
  let li='';
  ROAD.forEach((r,i)=>{const cls=i<T.i?'done':i===T.i?'here':'';
    li+='<li class="'+cls+'"'+(i===T.i?' id="here"':'')+'><div class="no">'+(i===0?'発':i===ROAD.length-1?'着':i)+'</div>'+
    '<div class="nm">'+r[0]+(i===T.i?'　🚶 いまここ':'')+'</div><div class="km">'+CUM[i].toFixed(1)+' km</div></li>'});
  const days=S.start?Math.round((parse(today())-parse(S.start))/864e5)+1:0;
  el.innerHTML='<h1>🗾 東海道五十三次の旅</h1><div class="card center">'+
    '<div class="sub">日本橋から歩いた距離'+(T.lap?'（'+(T.lap+1)+'周目）':'')+'</div><div class="big">'+T.pos.toFixed(1)+' km</div>'+
    '<div class="bar"><i style="width:'+Math.max(2,100*T.pos/TOTAL)+'%"></i></div>'+
    '<p class="sub">京都 三条大橋まで あと '+(TOTAL-T.pos).toFixed(1)+' km<br>出発から '+days+' 日目 ／ 合計 '+fmt(T.steps)+' 歩</p></div>'+
    (T.i>0||T.lap?'<button class="btn" style="margin:0 0 16px" onclick="celebrate(true,'+T.i+')">🎉 '+ROAD[T.i][0]+' 到着のお祝いを見る</button>':'')+
    '<div class="card"><ul class="road">'+li+'</ul><p class="sub">宿場の間の距離は、おおよその値です。</p></div>';
}

// ---------- 画面：先生へ ----------
function renderReport(){
  const el=document.getElementById('t-report'),A=analyze(),t=today();
  if(!repMonth)repMonth=t.slice(0,7);
  const first=Object.keys(S.days).sort()[0]||t; // 記録が始まる前の日は平均に入れない
  const y=+repMonth.slice(0,4),m=+repMonth.slice(5,7),last=new Date(y,m,0).getDate();
  const stat=(yy,mm)=>{const mk=yy+'-'+p2(mm),ld=new Date(yy,mm,0).getDate();let n=0,na=0,sum=0,ok=0,rest=0,best=0,bestK='',has=false;
    for(let d=1;d<=ld;d++){const k=mk+'-'+p2(d);if(k>t)break;if(k<first)continue;n++;if(A.st[k]!=='pre')na++;const v=S.days[k]||0;if(k in S.days)has=true;sum+=v;
      if(A.st[k]==='ok')ok++;if(A.st[k]==='rest')rest++;if(v>best){best=v;bestK=k}}
    return {n,na,sum,ok,rest,best,bestK,has,avg:n?sum/n:0}};
  const c=stat(y,m),pm=m===1?[y-1,12]:[y,m-1],p=stat(pm[0],pm[1]);
  let cal='';for(const w of WD)cal+='<div class="h">'+w+'</div>';
  for(let i=0;i<new Date(y,m-1,1).getDay();i++)cal+='<div></div>';
  for(let d=1;d<=last;d++){const k=repMonth+'-'+p2(d),s=A.st[k],fut=k>t;
    cal+='<div class="c '+(s==='ok'||s==='rest'?s:'')+'"><b>'+d+'</b><div class="m">'+(s==='ok'?'◎':s==='rest'?'休':'')+'</div><em>'+(fut?'':fmt(S.days[k]||0))+'</em></div>'}
  let cmp='';
  if(p.has&&c.n){const df=Math.round(c.avg-p.avg);cmp='<p>先月の平均 '+fmt(p.avg)+' 歩 → 今月 '+fmt(c.avg)+' 歩（<b>'+(df>=0?'+':'−')+fmt(Math.abs(df))+' 歩</b>）</p>'}
  const isNow=repMonth===t.slice(0,7);
  el.innerHTML='<h1>ウォーキング記録</h1>'+
    '<div class="monthnav"><button class="noprint" onclick="moveMonth(-1)" aria-label="前の月">◀</button><div>'+y+'年'+m+'月</div>'+
    '<button class="noprint" onclick="moveMonth(1)" aria-label="次の月"'+(isNow?' disabled style="opacity:.3"':'')+'>▶</button></div>'+
    '<div class="card"><div class="stats">'+
    '<div class="stat"><span>目標を達成した日</span><b>'+c.ok+'</b> <small>日／'+c.na+'日中</small></div>'+
    '<div class="stat"><span>1日の平均</span><b>'+fmt(c.avg)+'</b> <small>歩</small></div>'+
    '<div class="stat"><span>この月の合計</span><b>'+fmt(c.sum)+'</b> <small>歩</small></div>'+
    '<div class="stat"><span>いちばん歩いた日</span><b>'+fmt(c.best)+'</b> <small>歩'+(c.bestK?'（'+parse(c.bestK).getDate()+'日）':'')+'</small></div>'+
    (isNow?'<div class="stat"><span>いまの連続日数</span><b>'+A.streak+'</b> <small>日</small></div>':'')+
    '<div class="stat"><span>これまでの最高連続</span><b>'+A.best+'</b> <small>日</small></div></div>'+cmp+
    '<p class="sub">1日の目標 '+fmt(goalOn(repMonth+'-'+p2(Math.min(last,isNow?+t.slice(8):last))))+' 歩'+(c.rest?' ／ お休みチケット '+c.rest+'回使用':'')+'</p></div>'+
    '<div class="card"><h2>カレンダー</h2><div class="cal">'+cal+'</div><p class="sub">◎＝目標達成　休＝お休みチケット　数字＝その日の歩数'+(S.start?'<br>'+jdate(S.start)+' に開始。それより前は歩数のみ表示。':'')+'</p></div>'+
    '<button class="btn noprint" onclick="window.print()">🖨 印刷・PDFにする</button>';
}
function moveMonth(n){const y=+repMonth.slice(0,4),m=+repMonth.slice(5,7),d=new Date(y,m-1+n,1),k=ymd(d).slice(0,7);if(k<=today().slice(0,7)){repMonth=k;renderReport()}}

// ---------- 画面：設定 ----------
function renderSet(){
  const el=document.getElementById('t-set'),g=goalOn(today());
  el.innerHTML='<h1>設定</h1>'+
  '<div class="card"><h2>1日の目標歩数</h2><div class="setrow"><button onclick="chg(\'goal\',-100)" aria-label="減らす">−</button><div>'+fmt(g)+' <small>歩</small></div><button onclick="chg(\'goal\',100)" aria-label="増やす">＋</button></div>'+
    '<p class="sub">変えた目標は今日から使われます。これまでの記録はそのままです。</p></div>'+
  '<div class="card"><h2>お休みチケット（1か月の枚数）</h2><div class="setrow"><button onclick="chg(\'tickets\',-1)" aria-label="減らす">−</button><div>'+S.tickets+' <small>枚</small></div><button onclick="chg(\'tickets\',1)" aria-label="増やす">＋</button></div>'+
    '<p class="sub">目標に届かなかった日があっても、チケットが残っていれば連続日数は途切れません。自動で使われます。0枚にするとお休みなしです。</p></div>'+
  '<div class="card"><h2>歩幅（歩き旅の距離の計算用）</h2><div class="setrow"><button onclick="chg(\'stride\',-1)" aria-label="減らす">−</button><div>'+S.stride+' <small>cm</small></div><button onclick="chg(\'stride\',1)" aria-label="増やす">＋</button></div></div>'+
  '<div class="card"><h2>始めた日（歩き旅の出発日）</h2>'+(S.start?'<div class="setrow"><button onclick="chg(\'start\',-1)" aria-label="前の日">◀</button><div style="font-size:24px">'+jdate(S.start)+'</div><button onclick="chg(\'start\',1)" aria-label="次の日">▶</button></div>':'<p class="sub">まだ始まっていません</p>')+
    '<p class="sub">達成の◎・連続日数・お休みチケット・歩き旅は、この日から数えます。</p>'+
    '<button class="btn warn" onclick="restart()">今日、日本橋から出発しなおす</button></div>'+
  '<div class="card"><h2>記録の控え</h2>'+
    '<p class="sub">記録と設定を1つのファイルにして、iPhoneの「ファイル」やLINEに保存できます。月に1回ほど取っておくと安心です。</p>'+
    '<p>前回の控え：<b>'+(S.lastBackup?jdate(S.lastBackup):'まだ取っていません')+'</b></p>'+
    '<button class="btn" onclick="saveCopy()">💾 控えを取る</button>'+
    '<button class="btn ghost" onclick="document.getElementById(\'rf\').click()">控えのファイルから戻す</button>'+
    '<input type="file" id="rf" style="display:none" onchange="restore(this)"></div>'+
  '<div class="card"><h2>見本</h2><button class="btn ghost" onclick="startDemo();go(\'home\')">見本のデータで画面を見る</button></div>';
}
function chg(k,n){
  if(k==='goal')setGoal(Math.min(20000,Math.max(500,goalOn(today())+n)));
  if(k==='tickets')S.tickets=Math.min(5,Math.max(0,S.tickets+n));
  if(k==='stride')S.stride=Math.min(90,Math.max(40,S.stride+n));
  if(k==='start'&&S.start){const d=ymd(add(parse(S.start),n));if(d<=today()){S.start=d;S.station=Math.min(S.station,trip().g)}}
  save();renderSet();
}
// ---------- 記録の控え ----------
function saveCopy(){
  if(demo){alert('見本の表示中は控えを取れません。「見本を終わる」を押してからお試しください。');return}
  const name='ウォーキング控え-'+today()+'.txt';
  const file=new File([JSON.stringify(Object.assign({},S,{lastBackup:today()}))],name,{type:'text/plain'});
  const done=()=>{S.lastBackup=today();save();renderSet()};
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(done).catch(()=>{});
  }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();done();
  }
}
function restore(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let d=null;
    try{d=JSON.parse(r.result);if(!d||typeof d.days!=='object'||!Array.isArray(d.goals))d=null}catch(e){d=null}
    if(!d)alert('このファイルは、控えのファイルではないようです。');
    else if(confirm('控えのファイルから記録を戻します（'+Object.keys(d.days).length+'日分）。よろしいですか？')){
      if(demo)endDemo(true);
      // 設定は控えのものに戻す。歩数は、控えの分に今ある分を重ねる（同じ日は今ある方を使う）
      S=Object.assign(fresh(),d,{days:Object.assign({},d.days,S.days)});save();go('home');
      alert('記録を戻しました。');
    }
    inp.value='';
  };
  r.readAsText(f);
}
function restart(){if(confirm('歩き旅を、今日 日本橋から出発しなおします。よろしいですか？')){S.start=today();S.station=0;save();renderSet()}}

// ---------- お祝い ----------
// 音は fanfare.wav（index.html と同じ場所に置く音声ファイル）を再生する。
// 音声ファイルの再生は、iPhoneの消音スイッチが入っていても鳴る。
// ファイルが鳴らせなかったときは、Web Audio で同じ音を作って鳴らす（こちらは消音スイッチ中は鳴らない）。
const NOTES=[[523,0,.16],[659,.16,.16],[784,.32,.16],[1047,.48,.5],[784,.48,.5],[659,.48,.5],[1319,1.0,.7],[1047,1.0,.7],[784,1.0,.7]];
function fanfareWA(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();ac.resume();
    const t0=ac.currentTime+0.05;
    NOTES.forEach(n=>{
      const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=n[0];
      g.gain.setValueAtTime(0,t0+n[1]);g.gain.linearRampToValueAtTime(.22,t0+n[1]+.02);g.gain.exponentialRampToValueAtTime(.001,t0+n[1]+n[2]+.25);
      o.connect(g).connect(ac.destination);o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+.3)});
    setTimeout(()=>{try{ac.close()}catch(e){}},3000);
  }catch(e){}
}
function fanfare(){
  try{
    // 毎回新しく作る（前に再生に失敗した音声を使い回すと、iPhoneで鳴らなくなるため）
    if(fanfare.el){try{fanfare.el.pause();fanfare.el.removeAttribute('src');fanfare.el.load()}catch(e){}}
    const a=fanfare.el=new Audio('fanfare.wav');
    const p=a.play();if(p&&p.catch)p.catch(fanfareWA);
  }catch(e){fanfareWA()}
}
function confetti(){
  const cv=document.querySelector('#cele canvas'),cx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const col=['#1C8A57','#E2571C','#F2B62B','#1F6FB5','#D84B8A'],ps=[];
  for(let i=0;i<140;i++)ps.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,c:col[i%5],r:Math.random()*6});
  const end=Date.now()+4500;
  (function f(){cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()});
    if(Date.now()<end&&document.getElementById('cele').classList.contains('on'))requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height)})();
}
function celebrate(again,arrived){
  const t=today(),A=analyze(),v=S.days[t]||0,done=v>=goalOn(t);
  let h='';
  if(done)h+='<div class="emo">🎉</div><h2>今日は達成！</h2><p class="big">'+fmt(v)+' 歩</p><p class="streak">🔥 連続 <b>'+A.streak+'</b> 日</p>';
  else h+='<div class="emo">🏯</div>';
  if(arrived!=null)h+='<h2 style="color:var(--fire);font-size:28px">'+ROAD[arrived][0]+(arrived===ROAD.length-1?' に到着！東海道完歩！':' に到着！')+'</h2>';
  if(done)h+='<p>'+cheer(A.streak,true)+'</p>';
  h+='<button class="btn" onclick="fanfare();confetti()">🎺 ファンファーレを鳴らす</button><button class="btn ghost" onclick="closeCele()">とじる</button>';
  document.getElementById('celebox').innerHTML=h;
  document.getElementById('cele').classList.add('on');
  confetti();if(again)fanfare(); // 音はボタンを押したときだけ鳴らす（iPhoneは操作なしでは音を出せない）
}
function closeCele(){document.getElementById('cele').classList.remove('on')}
function checkCelebrate(){
  const t=today();if(!Object.keys(S.days).length)return;
  const T=trip(),done=(S.days[t]||0)>=goalOn(t),newDone=done&&S.celebrated!==t,arr=T.g>S.station?T.i:null;
  if(newDone)S.celebrated=t;
  if(arr!=null)S.station=T.g;
  if(newDone||arr!=null){save();celebrate(false,arr)}
}

// ---------- タブ ----------
const R={home:renderHome,log:renderLog,trip:renderTrip,report:renderReport,set:renderSet};
let cur='home';
function go(t){
  cur=t;
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  R[t]();scrollTo(0,0);
  if(t==='trip'){const h=document.getElementById('here');if(h&&h.previousElementSibling)h.scrollIntoView({block:'center'})}
}
function render(){R[cur]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
// ショートカットから開き直したときは、歩数を保存してからページを読み込み直す（音などの状態を毎回まっさらにするため）
addEventListener('hashchange',()=>{takeHash();location.reload()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
takeHash();if(!demo){render();checkCelebrate()}
</script>
